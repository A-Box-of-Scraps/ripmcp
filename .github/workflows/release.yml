name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      draft:
        description: Create a draft release
        type: boolean
        default: false
      version:
        description: "Override (bypasses SemVer); blank uses Cargo.toml version"
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  validate-ref:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate release ref
        run: python3 scripts/src/validate_ref.py
        env:
          RELEASE_BRANCH: ${{ github.event.repository.default_branch }}
  checks:
    needs: validate-ref
    uses: ./.github/workflows/ci.yml
    with:
      package-release: true
  release:
    needs: checks
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Download release artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: release-artifact
          path: dist
      - name: Verify release artifact
        working-directory: dist
        run: sha256sum -c SHA256SUMS
      - name: Create GitHub release
        id: release
        run: python3 scripts/src/create_release.py dist/ripmcp-x86_64-unknown-linux-gnu.tar.gz dist/SHA256SUMS
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_DRAFT: ${{ inputs.draft }}
          RELEASE_VERSION: ${{ inputs.version }}
  changelog:
    needs: release
    if: inputs.draft != true
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Check out default branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: next-cycle
          persist-credentials: true
      - name: Start next changelog cycle
        run: python3 scripts/src/update_changelog.py
        env:
          RELEASE_TAG: ${{ needs.release.outputs.tag }}
          RELEASE_BRANCH: ${{ github.event.repository.default_branch }}
