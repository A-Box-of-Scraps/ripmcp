[package]
name = "ripmcp"
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/A-Box-of-Scraps/ripmcp"

[lints.clippy]
complexity = { level = "deny", priority = -1 }
perf = { level = "deny", priority = -1 }
correctness = { level = "deny", priority = -1 }
suspicious = { level = "deny", priority = -1 }
cognitive_complexity = "deny"
excessive_nesting = "deny"
too_many_lines = "deny"
too_many_arguments = "deny"
type_complexity = "deny"
fn_params_excessive_bools = "deny"
struct_excessive_bools = "deny"

[dependencies]
base64 = "0.23"
clap = { version = "4.6.6", features = ["derive"] }
getrandom = "0.4"
reqwest = { version = "0.13.4", default-features = false, features = ["rustls", "stream"] }
rustix = { version = "1.1.4", features = ["fs", "process", "time", "termios"] }
secret-service = { version = "5.2.0", default-features = false, features = ["rt-tokio-crypto-rust"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["arbitrary_precision", "raw_value"] }
serde_path_to_error = "0.1.20"
sha2 = "0.11"
tokio = { version = "1", features = [
  "io-util",
  "macros",
  "net",
  "process",
  "rt-multi-thread",
  "signal",
  "sync",
  "time",
] }
tokio-util = { version = "0.7", features = ["rt"] }
url = "2.5.8"

[workspace.metadata.dylint]
libraries = [{ path = "lints/explicit-local-types" }]

# Self-uninstall tests hash the full debug executable in both test and CLI processes.
[profile.dev.package.sha2]
opt-level = 3

[dev-dependencies]
rustix = { version = "1.1.4", features = ["pty"] }
tempfile = "3.27.0"
